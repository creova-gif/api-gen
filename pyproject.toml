[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datapi"
version = "0.2.0"
description = "Raw data in. Production APIs out. Schema-to-API engine generating OpenAPI 3.1, FastAPI, and Cloud Run Terraform."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Justin Mafie"}
]
dependencies = []

[project.optional-dependencies]
analytics = ["duckdb>=1.0.0"]
test = ["fastapi>=0.110.0,<1.0.0", "httpx>=0.28.1", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
datapi = "datapi.cli:main"
apigen = "datapi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datapi*"]

[tool.setuptools.package-data]
datapi = ["studio/*.html", "studio/assets/*.svg"]
