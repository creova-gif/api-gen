[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datapi"
version = "0.1.0"
description = "Raw data in. Production APIs out. Schema-to-API engine generating OpenAPI 3.1, FastAPI, and Cloud Run Terraform."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Justin Mafie"}
]
dependencies = []

[project.scripts]
datapi = "datapi.cli:main"
apigen = "datapi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datapi*"]

[tool.setuptools.package-data]
datapi = ["studio/*.html"]
