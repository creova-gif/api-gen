name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Ruff (errors and pyflakes)
      run: |
        pip install ruff
        ruff check --select E9,F apigen apigen.py tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Unit Tests
      run: |
        python -m unittest discover -s tests -v

    - name: Verify CLI Generation & Self-Maintaining Diff
      run: |
        python apigen.py inspect -d examples/customers.csv
        python apigen.py generate -d examples/customers.csv -o ./test_api --auth --mock 10
        test -f test_api/openapi.json
        test -f test_api/app/main.py
        test -f test_api/tests/test_api.py
        test -f test_api/terraform/main.tf
        test -f test_api/sdk/client.ts
        python apigen.py diff -a examples/customers.csv -b examples/customers_v2.csv --pr pr_test.md
        test -f pr_test.md

    - name: Run Generated Service Test Suites
      run: |
        python apigen.py generate -d examples/inventory.json -o ./test_api_json --mock 30
        for dir in test_api test_api_json; do
          python -m venv "$dir/.venv"
          "$dir/.venv/bin/pip" install -q -r "$dir/requirements-dev.txt"
          (cd "$dir" && .venv/bin/python -m pytest tests -q)
        done

  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build and install wheel
      run: |
        python -m pip install build
        python -m build --wheel
        python -m venv /tmp/wheel-venv
        /tmp/wheel-venv/bin/pip install dist/*.whl
    - name: Smoke test installed CLI outside the repo
      working-directory: /tmp
      run: |
        /tmp/wheel-venv/bin/apigen generate -d "$GITHUB_WORKSPACE/examples/customers.csv" -o /tmp/wheel_api --auth --mock 10
        test -f /tmp/wheel_api/app/main.py
        /tmp/wheel-venv/bin/python -c "import apigen, pathlib; assert (pathlib.Path(apigen.__file__).parent / 'studio' / 'index.html').is_file()"

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build generated service image
      run: |
        python apigen.py generate -d examples/customers.csv -o ./docker_api --auth --mock 10
        docker build -t apigen-ci ./docker_api
    - name: Run container and probe endpoints
      run: |
        docker run -d --name apigen-ci -p 8080:8080 -e API_KEY=ci-key apigen-ci
        for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
        test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-API-Key: ci-key' http://localhost:8080/customers)" = 200
        test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/customers)" = 401
        test "$(docker exec apigen-ci id -u)" != 0
    - name: Container logs
      if: always()
      run: docker logs apigen-ci || true
